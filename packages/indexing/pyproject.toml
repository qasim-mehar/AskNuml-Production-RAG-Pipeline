[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uni-rag-indexing"
version = "0.1.0"
description = "Vector, relational, and object-storage indexing for uni-rag."
requires-python = ">=3.11"
dependencies = [
    "uni-rag-core>=0.1.0",
    "qdrant-client>=1.12,<2",
    "minio>=7.2,<8",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
]

[tool.uv.sources]
uni-rag-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/uni_rag_indexing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Package-scoped runs resolve the shared root `tests` package (L12).
pythonpath = ["src", "../.."]
markers = ["integration: requires live compose services or a local store"]
