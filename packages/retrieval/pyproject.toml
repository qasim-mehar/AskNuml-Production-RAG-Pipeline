[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uni-rag-retrieval"
version = "0.1.0"
description = "Query routing, search, reranking, and answer synthesis for uni-rag."
requires-python = ">=3.11"
dependencies = [
    "uni-rag-core>=0.1.0",
]

# Live providers are opt-in per ADR 0002: the opt-in setting is pending a Lane 0
# CONTRACT-CHANGE PR, so SDKs are optional extras rather than default deps.
# They are imported lazily inside adapters/ only (L15) and never in CI (L4).
[project.optional-dependencies]
google = ["google-genai>=1.0"]
openai = ["openai>=1.0"]

[tool.uv.sources]
uni-rag-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/uni_rag_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
