[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uni-rag-eval"
version = "0.1.0"
description = "Metrics, golden sets, ablations, and evaluation runners for uni-rag."
requires-python = ">=3.11"
dependencies = [
    "uni-rag-core>=0.1.0",
    "pydantic>=2.0",
]

[tool.uv.sources]
uni-rag-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/uni_rag_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gate: regression gate test; select with `pytest -m gate`",
]
