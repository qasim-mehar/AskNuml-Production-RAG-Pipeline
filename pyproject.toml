[project]
name = "uni-rag"
version = "0.1.0"
description = "Production-grade RAG for university students — foundation workspace"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
uni-rag-core = { workspace = true }
uni-rag-ingestion = { workspace = true }
uni-rag-indexing = { workspace = true }
uni-rag-retrieval = { workspace = true }
uni-rag-eval = { workspace = true }
uni-rag-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pre-commit>=3.8",
    "httpx>=0.27",
    "alembic>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", ".next"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["uni_rag_core", "uni_rag_ingestion", "uni_rag_indexing", "uni_rag_retrieval", "uni_rag_eval", "uni_rag_api"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
files = ["packages", "apps/api/src", "tests"]
# Placeholder test packages under each distribution all map to `tests`;
# cross-package tests live in the root `tests/` package and are checked there.
exclude = ["packages/[^/]+/tests/"]

[[tool.mypy.overrides]]
module = ["importlinter.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "apps/api/tests"]
pythonpath = [
  ".",
  "packages/core/src",
  "packages/ingestion/src",
  "packages/indexing/src",
  "packages/retrieval/src",
  "packages/eval/src",
  "apps/api/src",
  # Lane test dirs are explicit: with --import-mode=importlib pytest no longer
  # prepends each test dir to sys.path, so bare `helpers` / `conftest` / `_helpers`
  # imports must resolve deterministically. `eval_helpers` is uniquely named so
  # it cannot shadow the API lane's `helpers` (collection fix, not a mask).
  "apps/api/tests",
  "packages/eval/tests",
  "packages/ingestion/parsers/tests",
]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.coverage.run]
source = ["uni_rag_core"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
